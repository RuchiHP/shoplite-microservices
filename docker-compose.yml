# ShopLite - run everything locally with:  docker compose up --build
# Copy .env.example to .env first and fill in the passwords.

services:

  # ---------- User Service (Iatidel) ----------
  users-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: ${USERS_DB_NAME}
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
    volumes:
      - users-db-data:/var/lib/postgresql/data          # keeps data after restart
      - ./db/users-init.sql:/docker-entrypoint-initdb.d/users-init.sql:ro  # creates the users table
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER} -d ${USERS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [shoplite-net]

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      DB_HOST: users-db            # the service name above, not "localhost"
      DB_PORT: 5432
      DB_NAME: ${USERS_DB_NAME}
      DB_USER: ${USERS_DB_USER}
      DB_PASSWORD: ${USERS_DB_PASSWORD}
    ports:
      - "5000:5000"
    depends_on:
      users-db:
        condition: service_healthy   # wait until Postgres is ready
    networks: [shoplite-net]

  # ---------- Product Service (Ruchi) ----------
  products-db:
    image: mongo:7
    container_name: products-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PRODUCTS_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PRODUCTS_DB_PASSWORD}
    volumes:
      - products-db-data:/data/db
    networks: [shoplite-net]

  # Uncomment when Ruchi's product-service has a Dockerfile.
  # Check her port number and change 5001 if needed.
  # product-service:
  #   build: ./product-service
  #   container_name: product-service
  #   environment:
  #     MONGO_URI: mongodb://${PRODUCTS_DB_USER}:${PRODUCTS_DB_PASSWORD}@products-db:27017/
  #     MONGO_DB: ${PRODUCTS_DB_NAME}
  #     Port: 5001
  #   ports:
  #     - "5001:5001"
  #   depends_on:
  #     - products-db
  #   networks: [shoplite-net]

networks:
  shoplite-net:

volumes:
  users-db-data:
  products-db-data:
